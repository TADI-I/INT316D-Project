<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Successfully added task</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: #4CAF50;
      color: white;
      padding: 2rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
    }

    .sucess-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .button-container {
      margin-top: 1.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.button {
      text-decoration: none;
      background-color: #4CAF50;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 5px;
      transition: background-color 0.3s ease;
      font-size: 1rem;
    }

    a.button:hover {
      background-color: #45a049;
    }

    footer {
      background: #eee;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>TaskFlow</h1>
    <p>Your simple and smart task management solution</p>
  </header>
  <div class="sucess-container">
    <h2>Your task added successfully!</h2>
    <p>Your task has been saved and added to your list of tasks.</p>
    <div class="button-container">
      <a href="index.html" class="button">Add More Tasks</a>
      <a href="ViewAll" class="button">View All Tasks</a>
    </div>
  </div>
  <footer>
    &copy; 2025 TaskFlow. All rights reserved.
  </footer>
</body>
</html>
